<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Proyecto Deforestación</title>

    <link rel="stylesheet" href="Amb.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
    <header>
        <h1>Deforestación e Incendios Forestales</h1>
    </header>

    <main>
        <div class="buttons">
            <button id="btnInfo" type="button">Información</button>
            <button id="btnMapa" type="button">Mapa</button>
            <button id="btnQuiz" type="button">Cuestionario</button>
        </div>

        <section id="infoSection" class="hidden">
            <div id="infoContent"></div>
        </section>

        <section id="mapSection" class="hidden">
            <div id="map"></div>
            <div id="infoBox">Haz clic en un marcador para ver la situación forestal.</div>
        </section>

        <section id="quizSection" class="hidden">
            <div id="quiz"></div>
            <button id="submitQuiz" type="button">Enviar respuestas</button>
            <div id="quizResult"></div>
        </section>
    </main>

    <footer>
        Proyecto educativo de concienciación sobre la deforestación.
    </footer>

    <script src="1st.js"></script>
</body>
</html>
